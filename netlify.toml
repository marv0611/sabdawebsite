# SABDA — Netlify configuration
# Static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

# Five legacy flat aliases (classes.html, hire.html, events.html,
# pricing.html, about.html) share a name with a real directory. Netlify was
# resolving /classes/ to classes.html, a 2.4KB stub whose only job is to
# redirect to /classes/ — so the page redirected to itself forever and never
# rendered. These rules pin each directory URL to its real index.html.
[[redirects]]
  from = "/classes/"
  to = "/classes/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/hire/"
  to = "/hire/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/events/"
  to = "/events/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/pricing/"
  to = "/pricing/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/about/"
  to = "/about/index.html"
  status = 200
  force = true

# Deprecated blog URLs. These were 301s in Cloudflare's redirect rules, which no
# longer run now the site is served by Netlify. The pages still meta-refresh, so
# visitors reach the right place, but search engines were seeing a 200 instead of
# a permanent redirect. Restored as real 301s.
[[redirects]]
  from = "/blog/planes-barcelona-gratis/*"
  to = "/blog/cosas-que-hacer-en-barcelona/#planes-gratis"
  status = 301
  force = true

[[redirects]]
  from = "/blog/que-hacer-barcelona-lluvia/*"
  to = "/blog/cosas-que-hacer-en-barcelona/#planes-lluvia"
  status = 301
  force = true

[[redirects]]
  from = "/blog/pilates-dolor-espalda/*"
  to = "/blog/pilates-barcelona-guia/#pilates-espalda"
  status = 301
  force = true

# The fourth deprecated blog URL, missed when the other three were restored.
# /blog/hen-party-barcelona/ is a 147-word meta-refresh stub pointing at the
# Spanish despedida article. Scoped to /blog/ on purpose: the commercial spoke
# at /hen-party-barcelona/ is a real page and must keep returning 200.
[[redirects]]
  from = "/blog/hen-party-barcelona/*"
  to = "/blog/despedida-de-soltera-barcelona/"
  status = 301
  force = true

# Orphaned pricing page. Nothing links to it and it duplicates /pricing/.
[[redirects]]
  from = "/classes/pricing.html"
  to = "/pricing/"
  status = 301
  force = true

# ── Security headers ─────────────────────────────────────────────────────────
# These four were sent by Cloudflare and disappeared when the site moved to
# Netlify; only strict-transport-security survived because Netlify sends it.
# Deliberately conservative so nothing breaks:
#   X-Frame-Options SAMEORIGIN, not DENY, because test-responsive.html frames
#     our own pages. We only ever embed third parties (Google Maps), never the
#     reverse, so no partner loses an embed.
#   Referrer-Policy strict-origin-when-cross-origin is already Chrome's default,
#     so behaviour is unchanged and Momence still sees our origin as referrer.
#   Permissions-Policy names only camera, microphone and geolocation, all three
#     verified unused sitewide. payment, autoplay and fullscreen are left at
#     their defaults so hero video and Momence checkout are untouched.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Caching ──────────────────────────────────────────────────────────────────
# Netlify's default is public,max-age=0,must-revalidate, which makes the browser
# revalidate every asset on every page view. Cloudflare previously sent
# max-age=600, so the move made repeat visits and page-to-page navigation
# noticeably slower. HTML stays revalidated so content changes appear at once;
# static assets get long cache lifetimes.

# Images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Video
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Scripts and styles. Shorter than images because cookie-consent.js and the
# worker-facing scripts are edited occasionally and must not go stale for a month.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML: always revalidate, so edits appear immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
