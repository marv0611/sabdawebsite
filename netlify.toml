# SABDA — Netlify configuration
# Static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

# Five legacy flat aliases (classes.html, hire.html, events.html,
# pricing.html, about.html) share a name with a real directory. Netlify was
# resolving /classes/ to classes.html, a 2.4KB stub whose only job is to
# redirect to /classes/ — so the page redirected to itself forever and never
# rendered. These rules pin each directory URL to its real index.html.
[[redirects]]
  from = "/classes/"
  to = "/classes/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/hire/"
  to = "/hire/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/events/"
  to = "/events/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/pricing/"
  to = "/pricing/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/about/"
  to = "/about/index.html"
  status = 200
  force = true

# Deprecated blog URLs. These were 301s in Cloudflare's redirect rules, which no
# longer run now the site is served by Netlify. The pages still meta-refresh, so
# visitors reach the right place, but search engines were seeing a 200 instead of
# a permanent redirect. Restored as real 301s.
[[redirects]]
  from = "/blog/planes-barcelona-gratis/*"
  to = "/blog/cosas-que-hacer-en-barcelona/#planes-gratis"
  status = 301
  force = true

[[redirects]]
  from = "/blog/que-hacer-barcelona-lluvia/*"
  to = "/blog/cosas-que-hacer-en-barcelona/#planes-lluvia"
  status = 301
  force = true

[[redirects]]
  from = "/blog/pilates-dolor-espalda/*"
  to = "/blog/pilates-barcelona-guia/#pilates-espalda"
  status = 301
  force = true
